name: Main CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test and package
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Lift: Host=localhost;Port=5432;Database=lift;Username=lift;Password=lift_ci

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lift
          POSTGRES_USER: lift
          POSTGRES_PASSWORD: lift_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lift -d lift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve application version
        id: app-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
              exit 1
            fi
          else
            echo "value=Development" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Restore .NET tools and packages
        run: |
          dotnet tool restore
          dotnet restore server/Lift.Api.csproj
          dotnet restore tests/Lift.Api.Tests.csproj

      - name: Apply PostgreSQL migrations
        run: dotnet tool run dotnet-ef database update --project server --startup-project server

      - name: Run API tests
        run: dotnet test tests/Lift.Api.Tests.csproj --no-restore --configuration Release

      - name: Install frontend packages
        run: npm ci --prefix client

      - name: Lint frontend
        run: npm run lint --prefix client

      - name: Test frontend interactions
        id: frontend-tests
        continue-on-error: true
        run: npm test --prefix client

      - name: Write frontend test summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/lift-vitest-report.json`, 'utf8'))
          const summary = [
            `Test Files: ${report.numPassedTestSuites}/${report.numTotalTestSuites} Passed`,
            '',
            `Test Results: ${report.numPassedTests}/${report.numTotalTests} Passed`,
            '',
          ].join('\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          NODE

      - name: Check frontend test result
        if: steps.frontend-tests.outcome == 'failure'
        run: exit 1

      - name: Build frontend
        env:
          APP_VERSION: ${{ steps.app-version.outputs.value }}
        run: VITE_APP_VERSION="$APP_VERSION" npm run build --prefix client

      - name: Build application image
        env:
          APP_VERSION: ${{ steps.app-version.outputs.value }}
        run: docker build --build-arg APP_VERSION="$APP_VERSION" --tag lift:${GITHUB_SHA} .

      - name: Save image artifact
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: docker save lift:${GITHUB_SHA} | gzip > lift-image.tar.gz

      - name: Upload image artifact
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v7
        with:
          name: lift-image-${{ github.sha }}
          path: lift-image.tar.gz
          retention-days: 7
