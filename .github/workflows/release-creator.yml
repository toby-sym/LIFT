name: Release Creator

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (MAJOR.MINOR.PATCH)
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-creator
  cancel-in-progress: false

jobs:
  release:
    name: Merge, tag, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Release Creator from main."
          exit 1

      - name: Check out main and fetch release refs
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version and tag availability
        id: release-version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Enter a stable version in MAJOR.MINOR.PATCH format, such as 1.0.0."
            exit 1
          fi

          RELEASE_TAG="v${RELEASE_VERSION}"
          git fetch origin --prune --tags
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "::error::Tag ${RELEASE_TAG} already exists."
            exit 1
          fi

          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Merge main into release and push the release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create release --track origin/release
          git merge --no-edit origin/main
          git tag --annotate "$RELEASE_TAG" --message "Release ${RELEASE_VERSION}"
          git push --atomic origin HEAD:refs/heads/release "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --title "LIFT ${RELEASE_VERSION}" --generate-notes
